<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Prediksi</title>
    <link rel="stylesheet" href="/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
<div class="box">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px;">
        <a href="/" style="text-decoration:none; font-size:24px; color:white; transition:0.2s;">←</a>
        <h2 style="margin:0;">Hasil Prediksi</h2>
        <div style="width:24px;"></div>
    </div>

    <div class="result">
        <h3>{{ result }}</h3>
        <p><b>Confidence:</b> {{ confidence | default(0) | round(2) }}%</p>
    </div>

    <div class="result">
        <img src="{{ img_data }}" alt="Gambar yang diklasifikasikan">
    </div>

    <div class="result">
        <h3>Saran Pembuangan</h3>
        <p>{{ advice }}</p>
    </div>
</div>
</body>
</html>
